name: Import WagStack Demo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Import isolated demo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/hiruuu30/wagstack/tarball/demo/client-showcase -o /tmp/source.tar.gz
          mkdir -p /tmp/source
          tar -xzf /tmp/source.tar.gz -C /tmp/source --strip-components=1
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import isolated WagStack client demo"
          git push origin HEAD:main
