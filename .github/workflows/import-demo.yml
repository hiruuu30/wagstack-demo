name: Import WagStack Demo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import isolated demo branch
        run: |
          git clone --depth 1 --branch demo/client-showcase https://github.com/hiruuu30/wagstack.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf .git
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import isolated WagStack client demo"
          git push --force origin main
