name: WagStack visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture responsive dashboard
        env:
          CURRENT_URL: https://wagstack.brickand.bond/
        run: |
          mkdir -p qa/screenshots
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { chromium } = require('playwright');

          const sizes = [
            {name:'320', width:320, height:800},
            {name:'360', width:360, height:800},
            {name:'375', width:375, height:812},
            {name:'390', width:390, height:844},
            {name:'430', width:430, height:932},
            {name:'768', width:768, height:1024},
            {name:'900', width:900, height:1000},
            {name:'901', width:901, height:1000},
            {name:'1024', width:1024, height:900},
            {name:'1440', width:1440, height:1000},
          ];
          const slideSizes = sizes.filter(s => ['320','390','430','768'].includes(s.name));
          const darkSizes = sizes.filter(s => ['320','430','768'].includes(s.name));
          const desktopSizes = sizes.filter(s => s.width >= 901);

          const sha = path => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');

          async function prepare(page) {
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
            await page.addInitScript(() => {
              localStorage.setItem('wagstack-guest-mode-v1','1');
              localStorage.removeItem('wagstack-supabase-session-v1');
            });
            await page.goto(process.env.CURRENT_URL, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1800);
            return errors;
          }

          async function diagnostics(page) {
            return await page.evaluate(() => {
              const rect = sel => {
                const el = document.querySelector(sel);
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return {x:r.x,y:r.y,width:r.width,height:r.height,display:s.display,overflowX:s.overflowX,position:s.position};
              };
              const all = [...document.querySelectorAll('*')];
              const overflowers = all.map(el => {
                const r = el.getBoundingClientRect();
                return {tag:el.tagName, cls:String(el.className||'').slice(0,120), left:r.left, right:r.right, width:r.width};
              }).filter(x => x.right > innerWidth + 1 || x.left < -1).slice(0,40);
              const adoption = document.querySelector('.adoption-slide');
              const adoptionImg = adoption?.querySelector('img');
              const weather = document.querySelector('.weather-slide');
              return {
                viewport:{width:innerWidth,height:innerHeight},
                theme:document.documentElement.getAttribute('data-theme') || document.body.getAttribute('data-theme') || 'light',
                bodyClass:document.body.className,
                docScrollWidth:document.documentElement.scrollWidth,
                bodyScrollWidth:document.body.scrollWidth,
                horizontalOverflow:document.documentElement.scrollWidth > innerWidth + 1,
                overflowers,
                shell:rect('.shell'), rail:rect('.rail'), panel:rect('.shell__panel'), main:rect('#main-content'),
                promo:rect('.home__promo-card'), promoViewport:rect('.home__promo-viewport'), bento:rect('.bento'), firstBento:rect('.bento__card'),
                mobileStylePresent:!!document.getElementById('wagstack-mobile-dashboard-responsive'),
                mobileFixPresent:!!document.getElementById('wagstack-mobile-dashboard-visual-fix'),
                mobilePremiumPresent:!!document.getElementById('wagstack-mobile-dashboard-premium'),
                mobilePremiumV2Present:!!document.getElementById('wagstack-mobile-dashboard-premium-v2'),
                updatesEnhanced:!!document.querySelector('.home__promo-card.updates-enhanced'),
                groomingMini:rect('.mobile-grooming-next'),
                healthMini:rect('.mobile-health-summary'),
                adoption:{
                  present:!!adoption,
                  imageSrc:adoptionImg?.getAttribute('src') || null,
                  imageCurrentSrc:adoptionImg?.currentSrc || null,
                  imageNaturalWidth:adoptionImg?.naturalWidth || 0,
                  imageNaturalHeight:adoptionImg?.naturalHeight || 0,
                  rect: adoption ? (()=>{const r=adoption.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}})() : null
                },
                weather:{
                  present:!!weather,
                  title:weather?.querySelector('.update-copy strong')?.textContent?.trim() || null,
                  rect: weather ? (()=>{const r=weather.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}})() : null
                },
                title:document.title,
                url:location.href
              };
            });
          }

          async function showSlide(page, selector) {
            return await page.evaluate(selector => {
              const viewport = document.querySelector('[data-promo-viewport]');
              const slide = document.querySelector(selector);
              if (!viewport || !slide) return false;
              viewport.scrollTo({left:slide.offsetLeft, behavior:'instant'});
              return true;
            }, selector);
          }

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const report = {createdAt:new Date().toISOString(), current:[], dark:[], slides:[], desktopNoOp:[]};

            for (const size of sizes) {
              const context = await browser.newContext({viewport:{width:size.width,height:size.height}, deviceScaleFactor:1});
              const page = await context.newPage();
              const errors = await prepare(page);
              const diag = await diagnostics(page);
              diag.errors = errors;
              report.current.push({size,diag});
              await page.screenshot({path:`qa/screenshots/current-${size.name}.png`, fullPage:true});
              await context.close();
            }

            for (const size of darkSizes) {
              const context = await browser.newContext({viewport:{width:size.width,height:size.height}, deviceScaleFactor:1});
              const page = await context.newPage();
              const errors = await prepare(page);
              await page.evaluate(() => {
                document.documentElement.setAttribute('data-theme','dark');
                document.body.setAttribute('data-theme','dark');
              });
              await page.waitForTimeout(250);
              const diag = await diagnostics(page);
              diag.errors = errors;
              report.dark.push({size,diag});
              await page.screenshot({path:`qa/screenshots/dark-${size.name}.png`, fullPage:true});
              await context.close();
            }

            for (const size of slideSizes) {
              const context = await browser.newContext({viewport:{width:size.width,height:size.height}, deviceScaleFactor:1});
              const page = await context.newPage();
              const errors = await prepare(page);
              const adoptionShown = await showSlide(page,'.adoption-slide');
              await page.waitForTimeout(350);
              if (adoptionShown) await page.locator('.home__promo-card').screenshot({path:`qa/screenshots/adoption-${size.name}.png`});
              const adoptionDiag = await diagnostics(page);
              const weatherShown = await showSlide(page,'.weather-slide');
              await page.waitForTimeout(350);
              if (weatherShown) await page.locator('.home__promo-card').screenshot({path:`qa/screenshots/weather-${size.name}.png`});
              const weatherDiag = await diagnostics(page);
              report.slides.push({size,adoptionShown,weatherShown,adoptionDiag,weatherDiag,errors});
              await context.close();
            }

            for (const size of desktopSizes) {
              const context = await browser.newContext({viewport:{width:size.width,height:size.height}, deviceScaleFactor:1});
              const page = await context.newPage();
              const errors = await prepare(page);
              await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}.hero-canvas{display:none!important}.home__promo-viewport{scroll-behavior:auto!important}'});
              await page.evaluate(() => document.querySelector('[data-promo-viewport]')?.scrollTo({left:0,behavior:'instant'}));
              await page.waitForTimeout(120);
              const before=`qa/screenshots/desktop-with-mobile-css-${size.name}.png`;
              const after=`qa/screenshots/desktop-without-mobile-css-${size.name}.png`;
              await page.screenshot({path:before, fullPage:true});
              await page.evaluate(() => {
                document.getElementById('wagstack-mobile-dashboard-responsive')?.remove();
                document.getElementById('wagstack-mobile-dashboard-visual-fix')?.remove();
                document.getElementById('wagstack-mobile-dashboard-premium')?.remove();
                document.getElementById('wagstack-mobile-dashboard-premium-v2')?.remove();
                document.querySelector('[data-promo-viewport]')?.scrollTo({left:0,behavior:'instant'});
              });
              await page.waitForTimeout(60);
              await page.screenshot({path:after, fullPage:true});
              report.desktopNoOp.push({size,beforeSha:sha(before),afterSha:sha(after),pixelFilesIdentical:sha(before)===sha(after),errors});
              await context.close();
            }

            fs.writeFileSync('qa/report.json', JSON.stringify(report,null,2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wagstack-visual-qa
          path: qa
          if-no-files-found: error
